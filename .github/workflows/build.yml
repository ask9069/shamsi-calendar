name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (سریع - برای تست)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (فشرده - برای انتشار)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shamsi-calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK (فشرده‌تر)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shamsi-calendar-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Print APK sizes
        if: always()
        run: |
          echo "=== حجم فایل‌های APK ==="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "Debug APK یافت نشد"
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || echo "Release APK یافت نشد"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore
